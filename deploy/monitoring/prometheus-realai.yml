global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: realai-gateway
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/gateway-token
    static_configs:
      - targets: ["gateway.intra:4100"]

  - job_name: vllm-ascend
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: vllm-ascend
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  - job_name: ascend-npu-exporter
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: npu-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

rule_files:
  - /etc/prometheus/rules/realai-alerts.yml
