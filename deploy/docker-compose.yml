name: realai-gateway

services:
  gateway:
    image: ${GATEWAY_IMAGE:?请先生成环境配置}
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    command: ["--config", "/etc/realai/config.yaml", "--port", "4000", "--num_workers", "2"]
    depends_on:
      motor:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-4100}:4000"
    volumes:
      - motor_module_state:/app/motor-state
      - ./config.yaml:/etc/realai/config.yaml:ro
      - ./monitor-queries.json:/etc/realai/monitor-queries.json:ro
    environment:
      MOTOR_STATE_PATH: /app/motor-state/module.sqlite3
      REALAI_PRIVATE_NETWORK_ONLY: 'false'
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置内网 PostgreSQL 连接串}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?请设置网关管理密钥}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?请设置固定加密盐值}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:?请设置管理员密码}
      STORE_MODEL_IN_DB: 'True'
      REDIS_HOST: ${REDIS_HOST:?请配置内网 Redis 主机}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_SSL: ${REDIS_SSL:-false}
      REPORT_MODEL_TIMEOUT_SECONDS: ${REPORT_MODEL_TIMEOUT_SECONDS:-300}
      DIRECT_MONITOR_MAX_SAMPLES: ${DIRECT_MONITOR_MAX_SAMPLES:-2000000}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      REALAI_METRIC_ROUTING_ENABLED: ${REALAI_METRIC_ROUTING_ENABLED:-false}
      REALAI_ROUTING_METRIC_QUERY: ${REALAI_ROUTING_METRIC_QUERY:-sum(vllm:num_requests_waiting) by (model_name,instance) + sum(vllm:num_requests_running) by (model_name,instance)}
      REALAI_ROUTING_METRIC_REFRESH_SECONDS: ${REALAI_ROUTING_METRIC_REFRESH_SECONDS:-10}
      LITELLM_OFFLINE_MODE: 'true'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LITELLM_DISABLE_LATEST_RELEASE_CHECK: 'true'
      DO_NOT_TRACK: '1'
      TELEMETRY: 'False'
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      PRISMA_TELEMETRY_INFORMATION: ''
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: ${GATEWAY_HEALTH_START_PERIOD:-1800s}
    security_opt:
      - no-new-privileges:true

  motor:
    image: ${MOTOR_IMAGE:-realai/motor:3.2.0-runtime-arm64}
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    init: true
    environment:
      USER_CONFIG_PATH: /etc/motor/coordinator.json
      MOTOR_RUNTIME_DIR: /etc/motor
      MOTOR_LOG_PATH: /var/log/motor
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TZ: Asia/Shanghai
    volumes:
      - motor_config:/etc/motor
      - motor_logs:/var/log/motor
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "python", "-c", "import os, pathlib, urllib.request; root=pathlib.Path(os.getenv('MOTOR_RUNTIME_DIR','/etc/motor')); key=(root/'secrets/management-key').read_text().strip(); request=urllib.request.Request('http://127.0.0.1:1026/liveness', headers={'X-Motor-Management-Key': key}); urllib.request.urlopen(request, timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s
    security_opt:
      - no-new-privileges:true

  database:
    profiles: ["local-dependencies"]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      POSTGRES_DB: realai
      POSTGRES_USER: realai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
      TZ: Asia/Shanghai
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realai -d realai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: ["local-dependencies"]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-only-password}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  motor_module_state:
  motor_config:
  motor_logs:
  database_data:
  redis_data:

